<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <meta name="description" content=""/>
        <meta name="author" content=""/>
        <title>Site Not Configured</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Bootstrap core CSS -->
        <link href="bootstrap_theme/bootstrap.css" rel="stylesheet" type="text/css">
        <link href="https://fonts.googleapis.com/css2?family=Pridi:wght@400&family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
        <!-- Custom styles for this template -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="./assets/css/error-page.css" rel="stylesheet">
    </head>
    <body class="site-error-body">
        <main class="site-error-page min-vh-100" data-site-error-page data-error-code="OOPS">
            <div class="container-fluid px-3">
                <div class="site-error-copy">
                    <h1 class="site-error-title">Something went wrong</h1>
                    <p class="mt-4">This page isn't available right now.</p>
                    <p>Please contact<a class="site-error-link" href="mailto:support@foneworx.co.za" data-support-link>
                        support</a> and include the full web address you were trying to access so we can investigate. </p>
                    <div class="site-error-actions">
                        <a class="btn btn-info site-error-action" href="mailto:support@foneworx.co.za" data-support-link>
                        Contact support </a>
                        <button class="btn btn-outline-light site-error-action" type="button" data-reload-page>
                            Try again
</button>
                    </div>
                </div>
            </div>
            <div data-site-error-visual></div>
        </main>
        <script src="./assets/js/error-page.js"></script>
        <script src="bootstrap/js/bootstrap.min.js"></script>
        <script src="pgia/lib/pgia.js"></script>
    </body>
</html>
